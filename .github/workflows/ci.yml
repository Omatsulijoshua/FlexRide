name: FlexRide CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Production readiness report
        run: |
          mkdir -p reports
          pwsh ./scripts/verify-production-readiness.ps1 -Json > reports/production-readiness-ci.json
